[project]
name = "credit-extract"
version = "0.1.0"
description = "Credit agreement extraction & versioning pipeline (POC). See credit-agreement-extraction-HANDOVER.md."
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps are added per milestone as they are actually used (spec §20).
# Every dependency must be permissively licensed — enforced by scripts/check_licences.py (spec §5).
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdfium2>=5.13.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "scipy>=1.17.1",
    "typer>=0.12",
]

[project.scripts]
cae = "credit_extract.cli:app"

[project.optional-dependencies]
frontier = [
    "anthropic>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",   # every test runs with networking disabled (spec §5 offline test)
    "pip-licenses>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
